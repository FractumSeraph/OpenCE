[package]
name = "halo-native-gateway"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
bytes = "1.10.1"
chacha20poly1305 = "0.10.1"
getrandom = "0.3.3"
hex = "0.4.3"
hmac = "0.12.1"
kcp = "0.6.0"
rumqttc = "0.25.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
subtle = "2.6.1"
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
