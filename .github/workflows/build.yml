      - uses: actions/cache@v4
        with:
          path: build/downloads
          key: ffmpeg-source-${{ hashFiles('tools/ffmpeg_build.py') }}

      # musl and SDL, which configure.py fetches
      - uses: actions/cache@v4
        with:
          path: build/android/third_party
          key: android-third-party-${{ hashFiles('tools/android_build.py') }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('port/android/**/*.gradle*', 'port/android/gradle/wrapper/gradle-wrapper.properties') }}

      # This fork's own key (FractumSeraph/OpenCE), on its pushes: the
      # repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (set by the owner's
      # tools/android-signing-setup.ps1, never committed) make
      # keystore.properties, and both apps are signed with it
      # (chupathingyce-android-<config>.apk), so that they install, and each
      # release over the one before.
      - name: Signing key
        if: github.event_name == 'push' && github.repository == 'FractumSeraph/OpenCE'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::no ANDROID_KEYSTORE_BASE64 secret: the release app is unsigned"
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/android.keystore"
          umask 077
          {
            echo "storeFile=$RUNNER_TEMP/android.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > port/android/keystore.properties

