name: Build

# Debug and release builds of the native ports (Linux and Windows, 32- and
# 64-bit, Android and its native 64-bit and 32-bit ARM apps, macOS), and release builds of the dedicated server (Linux
# x86, x64 and arm64) and its container, for every pushed commit and pull
# request, uploaded as artifacts: whether a change builds. tools/ci_build.py does each build; see it for the options.
#
# These builds are VERSION's -dev, and never look for updates. Releases and
# nightlies are built here too, by hand or by ChupathingyCE's release
# workflows (ChupathingyCE/command), which run this workflow on main with a
# commit and its version (tools/version.py): the builds are that commit's,
# as that version, and a release's look for newer releases. Those workflows
# then sign the Android app with ChupathingyCE's key (this repository has no
# key: the debug app has the runner's debug key, the release app is
# unsigned) and publish the builds to this repository's Releases. Each run
# also uploads chupathingyce-build-info: the commit and version it built.
#
# Kept cheap:
# - one job per platform builds both configurations, so its set-up (tools,
#   downloads, caches) is paid once;
# - compiles go through ccache, whose cache carries over from run to run, so
#   a commit only recompiles what it changed; downloads (SDL, musl, Gradle,
#   the Linux builds' system roots) are cached too;
# - pushes build only main, release branches and tags; every other branch
#   builds through its pull request, so a commit is not built twice;
# - a newer commit to a pull request or a release branch cancels its run
#   still going; main's runs are never canceled, so every commit of main
#   has its Build (ChupathingyCE/command's nightly takes main's newest);
# - changes that only touch documentation do not build (no check is
#   required to merge, so a pull request without a Build is not blocked);
# - the compile caches are saved only on main (each run restores main's
#   newest), so branches and pull requests do not crowd main's out of the
#   repository's 10 GB of caches;
# - Windows, whose minutes cost twice Linux's, builds only Windows;
# - artifacts are kept for three days.
on:
  push:
    branches:
      - main
      - "release-*"
      - "release/**"
    tags:
      - "**"
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      commit:
        description: The commit to build (a SHA; empty, the branch's)
        type: string
        default: ""
      version:
        description: The version (0.5.0b, 0.5.0b-nightly.42; empty, VERSION's -dev)
        type: string
        default: ""
      release:
        description: A release's build (its updater looks for newer releases; the version must be VERSION's)
        type: boolean
        default: false
      request:
        description: An ID that the caller finds this run by (in its name)
        type: string
        default: ""
      profile:
        description: Also build the profiling flavour (configure.py --profile) on Linux
        type: boolean
        default: false

# (a run started with a version is named for it, so that the release
# workflows find their run; the others keep GitHub's name)
run-name: ${{ inputs.version && format('Build {0} at {1} {2}', inputs.version, inputs.commit, inputs.request) || '' }}

# (a run started by hand is never canceled by a push, and cancels none; a
# push to main or a tag has a group of its own, so none is canceled or left
# waiting; a pull request's or a release branch's newer run cancels the last)
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('build-dispatch-{0}', github.run_id) || ((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && format('build-{0}-{1}', github.ref, github.sha) || format('build-{0}', github.ref)) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # (empty unless started with a version: VERSION's -dev, tools/version.py)
  HALO_VERSION: ${{ inputs.version }}
  HALO_RELEASE_BUILD: ${{ inputs.release && '1' || '0' }}
  # (a fork's: every push to its main is a release, published by the
  # release job below; tools/ci_build.py makes its version)
  HALO_FORK_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository != 'ChupathingyCE/chupathingyce' && '1' || '' }}
  CI_COMPILER_LAUNCHER: ccache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 1G

jobs:
  info:
    # what this run builds: the commit (inputs.commit, else the run's) and
    # the version, which the release workflows check before they publish
    # its builds
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      - name: Build info
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REQUEST: ${{ inputs.request }}
        run: |
          mkdir -p dist/chupathingyce-build-info
          python3 - > dist/chupathingyce-build-info/build-info.json <<'EOF'
          import json, os, subprocess
          from tools.version import release_build, version
          print(json.dumps({
              "commit": subprocess.run(["git", "rev-parse", "HEAD"], check=True, capture_output=True,
                                       text=True).stdout.strip(),
              "version": version(),
              "release": release_build(),
              "event": os.environ["EVENT"],
              "ref": os.environ["REF"],
              "request": os.environ["REQUEST"],
          }, indent=2))
          EOF
          cat dist/chupathingyce-build-info/build-info.json

      - uses: actions/upload-artifact@v4
        with:
          name: chupathingyce-build-info
          path: dist/chupathingyce-build-info
          retention-days: 3

  linux:
    # Ubuntu 24.04 with clang 22 from apt.llvm.org (the profile-guided
    # optimisation in pgo/ needs that major version; its bin directory goes
    # first on PATH, so that clang, ld.lld and llvm-profdata are clang 22's
    # rather than the runner's), and CMake, pkg-config and wayland-scanner
    # for the SDL 3 that the portable build brings. The build links against
    # Debian 11's 32-bit glibc 2.31 (tools/linux_sysroot.py), not Ubuntu's,
    # so that it starts on older distributions; Ubuntu's 32-bit glibc
    # (gcc-multilib) is for the tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install the toolchain
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/noble/ llvm-toolchain-noble-$LLVM_MAJOR main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-$LLVM_MAJOR lld-$LLVM_MAJOR llvm-$LLVM_MAJOR \
            libclang-rt-$LLVM_MAJOR-dev gcc gcc-multilib libc6-dev-i386 cmake pkg-config libwayland-bin \
            ninja-build ccache python3-pytest zstd
          echo "/usr/lib/llvm-$LLVM_MAJOR/bin" >> "$GITHUB_PATH"
        env:
          LLVM_MAJOR: 22

      - name: Toolchain versions
        run: |
          clang --version | head -n 1
          ld.lld --version
          llvm-profdata --version | head -n 2
          cmake --version | head -n 1
          ccache --version | head -n 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      # (restored on every run, saved only on main: other branches' and pull
      # requests' runs start from main's and keep nothing of their own)
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-linux-ubuntu-clang22-${{ github.sha }}
          restore-keys: ccache-linux-ubuntu-clang22-

      # the FFmpeg source tarball (tools/download.py): kept so most runs fetch nothing
      - uses: actions/cache@v4
        with:
          path: build/downloads
          key: ffmpeg-source-${{ hashFiles('tools/ffmpeg_build.py') }}

      # the system root and SDL's source, which the build downloads
      - uses: actions/cache@v4
        with:
          path: build/linux/third_party
          key: linux-third-party-${{ hashFiles('tools/linux_sysroot.py') }}

      # the system root and SDL's source, which the build downloads
      - uses: actions/cache@v4
        with:
          path: build/linux/third_party
          key: linux-third-party-${{ hashFiles('tools/linux_sysroot.py') }}

      - name: Debug
        run: python3 tools/ci_build.py linux debug

      # (the profiling build, configure.py --profile, which no other step
      # compiles: only when a run started by hand asks for it, as it costs a
      # build of its own)
      - name: Profile
        if: github.event_name == 'workflow_dispatch' && inputs.profile
        run: python tools/ci_build.py linux profile

      - name: Release
        run: python3 tools/ci_build.py linux release

      # (no executable or library that needs a newer glibc than the system
      # root's: tools/linux_glibc_check.py)
      - name: glibc 2.31
        run: python3 tools/linux_glibc_check.py dist/chupathingyce-linux-debug dist/chupathingyce-linux-release

      # (not tools/stagekit/tests: OpenCE's StageKit writes Custom Edition maps
      # with OpenCE's cache_file_formats, which this fork replaces with
      # ChupathingyCE's ce_*.c; build/UPDATING.md, 2026-10-20)
      - name: Test
        run: |
          python3 -m pytest -q tools/test_linux_port.py tools/test_android_asm_convert.py tools/test_android_mirror_uploads.py tools/test_touch_menu.py tools/test_ui_point.py tools/test_p2p_copies.py tools/test_ping.py tools/test_save_folder.py tools/test_packaged_install.py tools/test_server_control.py tools/test_delta.py tools/test_delta_peer.py tools/test_delta_compat.py tools/test_network_rules.py tools/test_profile.py tools/test_map_torrents.py tools/test_map_families.py tools/test_map_packs.py tools/test_bmp_files.py tools/test_host_watch_hash.py tools/test_virtual_keyboard_input.py tools/test_settings_sections.py tools/test_loading_picture.py tools/harness tools/test_map_download.py tools/test_playlist_maps.py tools/test_map_report.py tools/test_event_log.py tools/test_update_manifest.py tools/test_gamespy_listing.py tools/test_determinism.py tools/test_android_ce_texture_cache.py tools/test_server_sim.py tools/test_egg.py tools/test_deploy_gametypes.py
          # OpenCE's dedicated server (halo --server): --version, and --server without maps refused (exit code 2);
          # its cases with clients need the retail maps, and are skipped
          python3 -m pytest -q tools/test_dedicated_server.py
          python3 tools/test_light_storage.py
          python3 tools/test_rendered_lights_storage.py
          python3 tools/test_port_config.py
          python3 tools/test_tick_input.py
          python3 tools/test_audio_doppler.py
          python3 tools/test_controller_layout.py
          python3 tools/test_button_mappings.py
          python3 tools/test_split_screen_input.py
          python3 tools/test_tag_byte_swap.py
          python3 tools/test_bitmap_byte_order.py

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: chupathingyce-linux-debug
          path: dist/chupathingyce-linux-debug
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: chupathingyce-linux-release
          path: dist/chupathingyce-linux-release
          retention-days: 3

      # (only in a run started by hand, which never publishes a release)
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.profile
        with:
          name: chupathingyce-linux-profile
          path: dist/chupathingyce-linux-profile
          retention-days: 3

      # (kept by ChupathingyCE's release, not a download)
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-linux-release
          path: dist/chupathingyce-linux-release-symbols
          if-no-files-found: ignore
          retention-days: 3

      - uses: actions/cache/save@v4
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        with:
          path: .ccache
          key: ccache-linux-ubuntu-clang22-${{ github.sha }}

  linux64:
    # The native 64-bit Linux build (ninja linux64), on Ubuntu with clang 22
    # as the 32-bit one, and portable as it is: against Debian 11's amd64
    # glibc 2.31, with the SDL 3 it brings (tools/linux_sysroot.py --arch
    # amd64).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install the toolchain
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/noble/ llvm-toolchain-noble-$LLVM_MAJOR main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-$LLVM_MAJOR lld-$LLVM_MAJOR llvm-$LLVM_MAJOR \
            gcc cmake pkg-config libwayland-bin ninja-build ccache zstd
          echo "/usr/lib/llvm-$LLVM_MAJOR/bin" >> "$GITHUB_PATH"
        env:
          LLVM_MAJOR: 22

      - name: Toolchain versions
        run: |
          clang --version | head -n 1
          ld.lld --version
          llvm-profdata --version | head -n 2
          cmake --version | head -n 1
          ccache --version | head -n 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      # (restored on every run, saved only on main: other branches' and pull
      # requests' runs start from main's and keep nothing of their own)
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-linux64-ubuntu-clang22-${{ github.sha }}
          restore-keys: ccache-linux64-ubuntu-clang22-

      # the FFmpeg source tarball (tools/download.py): kept so most runs fetch nothing
      - uses: actions/cache@v4
        with:
          path: build/downloads
          key: ffmpeg-source-${{ hashFiles('tools/ffmpeg_build.py') }}

      # the system root and SDL's source, which the build downloads
      - uses: actions/cache@v4
        with:
          path: build/linux64/third_party
          key: linux64-third-party-${{ hashFiles('tools/linux_sysroot.py') }}

      - name: Debug
        run: python3 tools/ci_build.py linux64 debug

      - name: Release
        run: python3 tools/ci_build.py linux64 release

      - name: glibc 2.31
        run: python3 tools/linux_glibc_check.py dist/chupathingyce-linux64-debug dist/chupathingyce-linux64-release

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: chupathingyce-linux64-debug
          path: dist/chupathingyce-linux64-debug
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: chupathingyce-linux64-release
          path: dist/chupathingyce-linux64-release
          retention-days: 3

      # (kept by ChupathingyCE's release, not a download)
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-linux64-release
          path: dist/chupathingyce-linux64-release-symbols
          if-no-files-found: ignore
          retention-days: 3

      - uses: actions/cache/save@v4
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        with:
          path: .ccache
          key: ccache-linux64-ubuntu-clang22-${{ github.sha }}

  server:
    # The dedicated server (tools/server_build.py): one static program for
    # each architecture, built against musl in Alpine Linux's container of
    # that architecture (tools/ci_build.py --alpine; x86 on the x86-64
    # runner, arm64 on GitHub's arm64 one), then started on the runner's
    # Ubuntu, which it shares nothing with: it prints its version, refuses
    # to start without a playlist, and stops with a clear error without maps.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: ubuntu-24.04
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      # (restored on every run, saved only on main: other branches' and pull
      # requests' runs start from main's and keep nothing of their own)
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-server-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ccache-server-${{ matrix.arch }}-

      # SDL's headers, which configure.py fetches
      - uses: actions/cache@v4
        with:
          path: build/server/third_party
          key: server-third-party-${{ matrix.arch }}-${{ hashFiles('tools/server_build.py') }}

      - name: Release
        run: python3 tools/ci_build.py server-${{ matrix.arch }} release --alpine

      # (static, against musl: no glibc version, and no library, to need)
      - name: glibc 2.31
        run: python3 tools/linux_glibc_check.py --static dist/chupathingyce-server-linux-${{ matrix.arch }}

      - name: Start it
        run: |
          smoke="$RUNNER_TEMP/smoke"
          server="$smoke/chupathingyce-server"
          mkdir -p "$smoke/data/playlists"
          cp dist/chupathingyce-server-linux-${{ matrix.arch }}/chupathingyce-server "$server"
          file "$server"
          # (a release's download is without its debug information)
          if file "$server" | grep -q "with debug_info"; then echo "not stripped"; exit 1; fi
          "$server" --version
          # no playlist: how to start one, and status 2
          status=0; "$server" || status=$?
          test "$status" = 2
          # a playlist, but no maps: a clear error, and status 1
          echo "bloodgulch slayer" > "$smoke/data/playlists/test.txt"
          status=0
          HALO_DATA_ROOT="$smoke/data" HALO_SAVE_ROOT="$smoke/saves" HALO_DEDICATED=playlists/test.txt \
            HALO_NET_ONLINE=false HALO_NET_LIST_GAMES=false \
            timeout 60 "$server" 2> "$smoke/error.txt" || status=$?
          cat "$smoke/error.txt"
          test "$status" = 1
          grep -q "no maps" "$smoke/error.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: chupathingyce-server-linux-${{ matrix.arch }}
          path: dist/chupathingyce-server-linux-${{ matrix.arch }}
          retention-days: 3

      # (kept by ChupathingyCE's release, not a download)
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-server-linux-${{ matrix.arch }}-release
          path: dist/chupathingyce-server-linux-${{ matrix.arch }}-release-symbols
          if-no-files-found: ignore
          retention-days: 3

      - uses: actions/cache/save@v4
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        with:
          path: .ccache
          key: ccache-server-${{ matrix.arch }}-${{ github.sha }}

  server-container:
    # The server's container (server/deploy/Dockerfile) for the three
    # architectures at once, from the server job's programs, as buildx makes
    # it (nothing runs while it builds); then each started once, as above
    # (arm64 emulated). Not pushed anywhere.
    needs: server
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      - uses: actions/download-artifact@v4
        with:
          pattern: chupathingyce-server-linux-*
          path: artifacts

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build
        run: |
          context="$RUNNER_TEMP/context"
          mkdir -p "$context"
          cp server/deploy/Dockerfile "$context/"
          for pair in x86:386 x64:amd64 arm64:arm64; do
            arch=${pair%%:*}; platform=${pair#*:}
            mkdir -p "$context/bin/$platform"
            cp "artifacts/chupathingyce-server-linux-$arch/chupathingyce-server" "$context/bin/$platform/"
            chmod +x "$context/bin/$platform/chupathingyce-server"
          done
          docker buildx build --platform linux/386,linux/amd64,linux/arm64 \
            --output type=oci,dest="$RUNNER_TEMP/chupathingyce-server.oci.tar" "$context"
          ls -l "$RUNNER_TEMP/chupathingyce-server.oci.tar"

      - name: Start each
        run: |
          for platform in 386 amd64 arm64; do
            docker buildx build --platform linux/$platform --load -t chupathingyce-server:$platform "$RUNNER_TEMP/context"
            docker run --rm --platform linux/$platform --cap-drop ALL --security-opt no-new-privileges \
              chupathingyce-server:$platform --version
            # (not root)
            test "$(docker image inspect -f '{{.Config.User}}' chupathingyce-server:$platform)" = 1000:1000
          done
          docker image ls chupathingyce-server

  android:
    # The runner image has the Android SDK and NDK, a JDK and CMake.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install the toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          # (each download checked against the hash it had when it was pinned)
          curl -fsSL -o ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip
          curl -fsSL -o ccache.tar.xz https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-linux-x86_64.tar.xz
          sha256sum -c - <<'EOF'
          6f98805688d19672bd699fbbfa2c2cf0fc054ac3df1f0e6a47664d963d530255  ninja.zip
          80cab87bd510eca796467aee8e663c398239e0df1c4800a0b5dff11dca0b4f18  ccache.tar.xz
          EOF
          unzip -q ninja.zip -d "$RUNNER_TEMP/tools" && rm ninja.zip
          tar -xJf ccache.tar.xz -C "$RUNNER_TEMP/tools" --strip-components=1 ccache-4.10.2-linux-x86_64/ccache && rm ccache.tar.xz
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      # (restored on every run, saved only on main: other branches' and pull
      # requests' runs start from main's and keep nothing of their own)
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-android-${{ github.sha }}
          restore-keys: ccache-android-

      # the FFmpeg source tarball (tools/download.py): kept so most runs fetch nothing
      - uses: actions/cache@v4
        with:
          path: build/downloads
          key: ffmpeg-source-${{ hashFiles('tools/ffmpeg_build.py') }}

      # musl and SDL, which configure.py fetches
      - uses: actions/cache@v4
        with:
          path: build/android/third_party
          key: android-third-party-${{ hashFiles('tools/android_build.py') }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('port/android/**/*.gradle*', 'port/android/gradle/wrapper/gradle-wrapper.properties') }}

      # This fork's own key (FractumSeraph/OpenCE), on its pushes: the
      # repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (set by the owner's
      # tools/android-signing-setup.ps1, never committed) make
      # keystore.properties, and both apps are signed with it
      # (chupathingyce-android-<config>.apk), so that they install, and each
      # release over the one before.
      - name: Signing key
        if: github.event_name == 'push' && github.repository == 'FractumSeraph/OpenCE'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::no ANDROID_KEYSTORE_BASE64 secret: the release app is unsigned"
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/android.keystore"
          umask 077
          {
