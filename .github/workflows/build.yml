    # tests it; nothing of it is published here (this fork's site is its own
    # browser build: web.yml).
    # Emscripten (emsdk, the version below, cached) builds the web port's
    # site (port/web/README.md); the tests check its graph, the page's
    # importer and service worker, its sockets, that it starts in a
    # headless Chromium (with no game data, as far as the menus' map), and
    # that two browsers join a room through a local MQTT broker.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EMSDK_VERSION: 6.0.10
    steps:
      - uses: actions/checkout@v4

