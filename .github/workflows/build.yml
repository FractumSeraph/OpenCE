          retention-days: 3

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-1.outputs.cache-hit != 'true' }}
        with:
          path: build/downloads
          key: ffmpeg-source-${{ hashFiles('tools/ffmpeg_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-2.outputs.cache-hit != 'true' }}
        with:
          path: build/windows/third_party
          key: windows-third-party-${{ hashFiles('tools/windows_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-3.outputs.cache-hit != 'true' }}
        with:
          path: build/windows/ffmpeg
          key: windows-ffmpeg-${{ hashFiles('tools/ffmpeg_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' }}
        with:
          path: .ccache
          key: ccache-windows-${{ github.sha }}

  windows64:
    needs: gate
    # The native 64-bit Windows build (ninja windows64), on the same runner
    # image as the 32-bit one, with Visual Studio's x64 libraries.
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the toolchain
        shell: pwsh
        run: |
          Invoke-WebRequest -OutFile ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip
          Invoke-WebRequest -OutFile ccache.zip https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-windows-x86_64.zip
          # (each download checked against the hash it had when it was pinned)
          if ((Get-FileHash ninja.zip -Algorithm SHA256).Hash -ne "F550FEC705B6D6FF58F2DB3C374C2277A37691678D6ABA463ADCBB129108467A") { throw "ninja.zip: unexpected SHA-256" }
          if ((Get-FileHash ccache.zip -Algorithm SHA256).Hash -ne "6252F081876A9A9F700FAE13A5AEC5D0D486B28261D7F1F72AC11C7AD9DF4DA9") { throw "ccache.zip: unexpected SHA-256" }
          Expand-Archive ninja.zip -DestinationPath "$env:RUNNER_TEMP\tools"
          Expand-Archive ccache.zip -DestinationPath $env:RUNNER_TEMP
          Copy-Item "$env:RUNNER_TEMP\ccache-4.10.2-windows-x86_64\ccache.exe" "$env:RUNNER_TEMP\tools"
          Remove-Item ninja.zip, ccache.zip
          "$env:RUNNER_TEMP\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      # (restored by a run without a version, saved only by main's head:
      # other branches' and pull requests' runs start from main's and keep
      # nothing of their own)
      - uses: actions/cache/restore@v4
        if: env.CACHE_RESTORE == 'true'
        with:
          path: .ccache
          key: ccache-windows64-${{ github.sha }}
          restore-keys: ccache-windows64-

      # the FFmpeg source tarball (tools/download.py): kept so most runs fetch nothing
      - uses: actions/cache/restore@v4
        id: cache-1
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/downloads
          key: ffmpeg-source-${{ hashFiles('tools/ffmpeg_build.py') }}

      # SDL's development package, which configure.py fetches (the 32-bit
      # job's: it holds both builds' libraries)
      - uses: actions/cache/restore@v4
        id: cache-2
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/windows/third_party
          key: windows-third-party-${{ hashFiles('tools/windows_build.py') }}

      # bgfx's, bx's and bimg's sources, which the build fetches for the bgfx
      # renderer (tools/bgfx_build.py): kept so most runs fetch nothing
      - uses: actions/cache/restore@v4
        id: cache-3
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/bgfx
          key: bgfx-source-${{ hashFiles('tools/bgfx_build.py') }}

      # the movies' FFmpeg (tools/ffmpeg_build.py), built once and cached:
      # its configure and make run under the runner's MSYS2, which needs make
      - name: MSYS2 make
        run: /c/msys64/usr/bin/pacman.exe -S --noconfirm --needed make diffutils

      - uses: actions/cache/restore@v4
        id: cache-4
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/windows64/ffmpeg
          key: windows64-ffmpeg-${{ hashFiles('tools/ffmpeg_build.py') }}

      - name: Debug
        if: env.BUILD_DEBUG == 'true'
        run: python tools/ci_build.py windows64 debug

      - name: Release
        run: python tools/ci_build.py windows64 release

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        if: env.BUILD_DEBUG == 'true'
        with:
          name: chupathingyce-windows64-debug
          path: dist/chupathingyce-windows64-debug
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: chupathingyce-windows64-release
          path: dist/chupathingyce-windows64-release
          retention-days: 3

      # (the 64-bit dedicated server for Windows: the server-windows job)

      # (halo.exe's symbols and map, which ChupathingyCE's release keeps
      # privately for the crash reports; not published)
      - uses: actions/upload-artifact@v4
        if: env.BUILD_DEBUG == 'true'
        with:
          name: symbols-windows64-debug
          path: dist/chupathingyce-windows64-debug-symbols
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: symbols-windows64-release
          path: dist/chupathingyce-windows64-release-symbols
          retention-days: 3

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-1.outputs.cache-hit != 'true' }}
        with:
          path: build/downloads
          key: ffmpeg-source-${{ hashFiles('tools/ffmpeg_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-2.outputs.cache-hit != 'true' }}
        with:
          path: build/windows/third_party
          key: windows-third-party-${{ hashFiles('tools/windows_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-3.outputs.cache-hit != 'true' }}
        with:
          path: build/bgfx
          key: bgfx-source-${{ hashFiles('tools/bgfx_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-4.outputs.cache-hit != 'true' }}
        with:
          path: build/windows64/ffmpeg
          key: windows64-ffmpeg-${{ hashFiles('tools/ffmpeg_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' }}
        with:
          path: .ccache
          key: ccache-windows64-${{ github.sha }}

  macos:
    needs: gate
    # Apple silicon, with Xcode's clang: the universal application (Apple
    # silicon and Intel, self-contained: tools/macos_build.py, --portable),
    # with its own SDL3 and the movies' FFmpeg, built once and cached. The application goes up as
    # a tar, which keeps its symbolic links and permissions (its signature
    # needs them).
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Install the toolchain
        run: brew install ninja ccache

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      # (restored by a run without a version, saved only by main's head:
      # other branches' and pull requests' runs start from main's and keep
      # nothing of their own)
      - uses: actions/cache/restore@v4
        if: env.CACHE_RESTORE == 'true'
        with:
          path: .ccache
          key: ccache-macos-${{ github.sha }}
          restore-keys: ccache-macos-

      # the FFmpeg source tarball (tools/download.py): kept so most runs fetch nothing
      - uses: actions/cache/restore@v4
        id: cache-1
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/downloads
          key: ffmpeg-source-${{ hashFiles('tools/ffmpeg_build.py') }}

      - uses: actions/cache/restore@v4
        id: cache-2
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/macos/third_party
          key: macos-sdl3-${{ hashFiles('tools/android_build.py', 'tools/macos_build.py', 'tools/ffmpeg_build.py') }}

      # bgfx's, bx's and bimg's sources, which the build fetches for the bgfx
      # renderer (tools/bgfx_build.py): kept so most runs fetch nothing
      - uses: actions/cache/restore@v4
        id: cache-3
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/bgfx
          key: bgfx-source-${{ hashFiles('tools/bgfx_build.py') }}

      - name: Debug
        if: env.BUILD_DEBUG == 'true'
        run: python3 tools/ci_build.py macos debug

      - name: Release
        run: python3 tools/ci_build.py macos release

      - name: Package
        run: |
          if [ "$BUILD_DEBUG" = true ]; then tar -C dist -cf chupathingyce-macos-debug.tar chupathingyce-macos-debug; fi
          tar -C dist -cf chupathingyce-macos-release.tar chupathingyce-macos-release

      - uses: actions/upload-artifact@v4
        if: env.BUILD_DEBUG == 'true'
        with:
          name: chupathingyce-macos-debug
          path: chupathingyce-macos-debug.tar
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: chupathingyce-macos-release
          path: chupathingyce-macos-release.tar
          retention-days: 3

      # (kept by ChupathingyCE's release, not a download)
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-macos-release
          path: dist/chupathingyce-macos-release-symbols
          if-no-files-found: ignore
          retention-days: 3

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-1.outputs.cache-hit != 'true' }}
        with:
          path: build/downloads
          key: ffmpeg-source-${{ hashFiles('tools/ffmpeg_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-2.outputs.cache-hit != 'true' }}
        with:
          path: build/macos/third_party
          key: macos-sdl3-${{ hashFiles('tools/android_build.py', 'tools/macos_build.py', 'tools/ffmpeg_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-3.outputs.cache-hit != 'true' }}
        with:
          path: build/bgfx
          key: bgfx-source-${{ hashFiles('tools/bgfx_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' }}
        with:
          path: .ccache
          key: ccache-macos-${{ github.sha }}

  web:
    # OpenCE's web build (ninja web, port/web/README.md), as OpenCE builds and
    # tests it; nothing of it is published here (this fork's site is its own
    # browser build: web.yml).
    # Emscripten (emsdk, the version below, cached) builds the web port's
    # site (port/web/README.md); the tests check its graph, the page's
    # importer and service worker, its sockets, that it starts in a
    # headless Chromium (with no game data, as far as the menus' map), and
    # that two browsers join a room through a local MQTT broker.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EMSDK_VERSION: 6.0.10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ hashFiles('port/web/halo_sdl3.py') }}

      - name: Install the toolchain
        run: |
          if [ ! -x ~/emsdk/upstream/emscripten/emcc ]; then
            rm -rf ~/emsdk
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
            ~/emsdk/emsdk install "$EMSDK_VERSION"
          fi
          ~/emsdk/emsdk activate "$EMSDK_VERSION"
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build ccache python3-pytest mosquitto

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-web-${{ github.sha }}
          restore-keys: ccache-web-

      - name: Debug
        run: |
          source ~/emsdk/emsdk_env.sh
          python3 tools/ci_build.py web debug

      - name: Release
        run: |
          source ~/emsdk/emsdk_env.sh
          python3 tools/ci_build.py web release

      - name: Test
        run: |
          source ~/emsdk/emsdk_env.sh
          node --test "port/web/tests/*.test.js"
          # (the dedicated server's admin page, port/assets/server_ui, against tools/server_sim.py)
          node --test tools/server_ui_tests/
          python3 -m pytest -q tools/test_web_build.py

      - name: Test in Chromium and Firefox
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/playwright" playwright@1.58
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium firefox
          NODE_PATH="$RUNNER_TEMP/playwright/node_modules" node port/web/tests/smoke.mjs dist/halo-web-release
          NODE_PATH="$RUNNER_TEMP/playwright/node_modules" node port/web/tests/rooms.mjs dist/halo-web-release
          # (the native builds' WebRTC, port/linux/src/p2p_webrtc.c, with both)
          NODE_PATH="$RUNNER_TEMP/playwright/node_modules" node port/web/tests/webrtc_native.mjs chromium firefox
          source ~/emsdk/emsdk_env.sh
          NODE_PATH="$RUNNER_TEMP/playwright/node_modules" node port/web/tests/mcc_storage.mjs chromium firefox

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: halo-web-debug
          path: dist/halo-web-debug
          include-hidden-files: true
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: halo-web-release
          path: dist/halo-web-release
          include-hidden-files: true
          retention-days: 3

  release:
    # A fork's own releases (FractumSeraph/OpenCE): every push to its main
    # that builds on every platform is published as v<VERSION>-fs.<run>,
    # marked latest, with the files the self-updaters ask for
    # (fractum-halo-<platform>-<config>.zip, as updates.json names them:
    # port/linux/src/updater.c, Updater.java; chupathingyce-* before
    # fs.00222), signed with the fork's update key, and the dedicated
    # servers; with OpenCE's SHA256SUMS of the release's files and, when the
    # RELEASE_SIGNING_KEY secret is set, its Ed25519 signature
    # (SHA256SUMS.sig, tools/release_sign.sh); the newest five are kept.
    # ChupathingyCE's own releases come from its release workflows instead.
    # (macOS's build is waited for but not required: GitHub's macOS runners
    # are often not to be had, and a release without it is published all the
    # same; a Mac's self-updater finds no file of its own in that release's
    # updates.json and stays on its version until one that has it. Every
    # other build must succeed, and a run cancelled by hand publishes nothing.)
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.repository != 'ChupathingyCE/chupathingyce' &&
      needs.linux.result == 'success' && needs.linux64.result == 'success' &&
      needs.server.result == 'success' && needs.server-windows.result == 'success' &&
      needs.android.result == 'success' && needs.android64.result == 'success' &&
      needs.android32.result == 'success' && needs.windows.result == 'success' &&
      needs.windows64.result == 'success'
    needs: [linux, linux64, server, server-windows, android, android64, android32, windows, windows64, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # (cone mode: the folders' own files come too, tools/*.py among them,
      # which tools/ci_build.py imports)
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            VERSION
            tools/update_sign.py
            port/linux/src/update_key.h
            tools/ci_build.py
            tools/version.py
            tools/release_sign.sh
            deploy/release-key.pub
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          # the fork's release key's private half (Ed25519 PEM), which signs
          # the update files; its public half is in update_key.h and
          # UpdateManifest.java
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          # OpenCE's release key's seed (64 hex digits), which signs the
          # release's SHA256SUMS; checked against deploy/release-key.pub, or
          # the RELEASE_PUBLIC_KEY variable's key (a fork's own)
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_PUBLIC_KEY: ${{ vars.RELEASE_PUBLIC_KEY }}
        run: |
          version="$(cat VERSION)-fs.$(printf '%05d' "$GITHUB_RUN_NUMBER")"
          mkdir release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            case "$name" in
              chupathingyce-build-info|chupathingyce-server-container*) continue ;;
              chupathingyce-android-debug-testkey) zipname=chupathingyce-android-debug ;;
              chupathingyce-android-release-unsigned) zipname=chupathingyce-android-release ;;
              chupathingyce-android64-debug-testkey) zipname=chupathingyce-android64-debug ;;
              chupathingyce-android64-release-unsigned) zipname=chupathingyce-android64-release ;;
              chupathingyce-android32-debug-testkey) zipname=chupathingyce-android32-debug ;;
              chupathingyce-android32-release-unsigned) zipname=chupathingyce-android32-release ;;
              *) zipname=$name ;;
            esac
            # (the fork's name for its downloads; the self-updaters, the VPS's
            # halo-gameservers-update among them, take the names updates.json
            # and the release give, so the builds before keep updating)
            zipname="fractum-halo-${zipname#chupathingyce-}"
            # (macOS's builds come as a tar, keeping the application's links)
            if ls "$dir"/*.tar >/dev/null 2>&1; then
              mkdir -p "unpacked/$name" && tar -C "unpacked/$name" -xf "$dir"/*.tar && dir="unpacked/$name/$name/"
            fi
            (cd "$dir" && zip -qry "$GITHUB_WORKSPACE/release/$zipname.zip" .)
          done
          # (the release apps bare as well, signed with the fork's key, at
          # names that stay the same, for a phone to install from a link:
          # releases/latest/download/fractum-halo-android.apk is always the
          # newest; halo.fractumseraph.net/assets/android/ links them;
          # fractum-halo-android32.apk is for a 32-bit-only Android, a watch's)
          for build in android android64 android32; do
            apk=$(find "artifacts/chupathingyce-$build-release-unsigned" -name '*.apk' | head -n 1)
            if [ -n "$apk" ]; then cp "$apk" "release/fractum-halo-$build.apk"; fi
          done
          # (the update files signed for the self-updaters: each zip's .sig, and
          # the release's list of them, updates.json and its .sig; checked
          # against update_key.h before they go out. tools/update_sign.py)
          files=(release/*.zip release/*.apk)
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            key="$RUNNER_TEMP/update-key.pem"
            (umask 077 && printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key")
            python3 tools/update_sign.py sign "$key" "$version" release/*.zip >/dev/null
            python3 tools/update_sign.py manifest "$key" "$version" --tag "v$version" --debug-tag "v$version" \
              --commit "$GITHUB_SHA" release/*.zip >/dev/null
            rm -f "$key"
            python3 tools/update_sign.py verify "$version" release/*.zip
            files+=(release/*.sig release/updates.json)
          else
            echo "::warning::no UPDATE_SIGNING_KEY secret: this release is not signed, and the self-updaters will not install it"
          fi
          # (OpenCE's SHA256SUMS of the release's files, and its signature by
          # the release key when the secret is set: tools/release_sign.sh,
          # checked before anything is published. Beside the update files'
          # signatures above, which the self-updaters check: not instead)
          python3 tools/ci_build.py sums release
          files+=(release/SHA256SUMS)
          if [ -n "$RELEASE_SIGNING_KEY" ]; then
            sh tools/release_sign.sh sign release/SHA256SUMS
            sh tools/release_sign.sh verify release/SHA256SUMS
            files+=(release/SHA256SUMS.sig)
          else
            echo "::warning::no RELEASE_SIGNING_KEY secret: the release's SHA256SUMS is not signed"
          fi
          ls -l release
          {
            echo "Built from $GITHUB_SHA on $GITHUB_REF_NAME (version $version)."
            echo
            echo "The release builds are for playing; the debug builds stop at the first failed assertion."
            if ! ls release/fractum-halo-macos-*.zip >/dev/null 2>&1; then
              echo
              echo "No macOS build in this release (GitHub's macOS runner was not to be had): the previous release's is the newest."
            fi
          } > notes.txt
          gh release create "v$version" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$version" --notes-file notes.txt --latest
          # (the newest five of these kept)
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | contains("-fs."))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r tag; do gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag; done
