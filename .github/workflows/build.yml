        with:
          name: chupathingyce-server-windows-x64
          path: dist/chupathingyce-server-windows-x64
          retention-days: 3

      # (kept by ChupathingyCE's release, not a download)
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-server-windows-x64-release
          path: dist/chupathingyce-server-windows-x64-release-symbols
          retention-days: 3

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-1.outputs.cache-hit != 'true' }}
        with:
          path: build/windows/third_party
          key: windows-third-party-${{ hashFiles('tools/windows_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' }}
        with:
          path: .ccache
          key: ccache-server-windows64-${{ github.sha }}

