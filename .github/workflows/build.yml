      - name: Install the toolchain
        run: |
          if [ ! -x ~/emsdk/upstream/emscripten/emcc ]; then
            rm -rf ~/emsdk
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
            ~/emsdk/emsdk install "$EMSDK_VERSION"
          fi
          ~/emsdk/emsdk activate "$EMSDK_VERSION"
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build ccache python3-pytest mosquitto

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-web-${{ github.sha }}
          restore-keys: ccache-web-

      - name: Debug
        run: |
          source ~/emsdk/emsdk_env.sh
          python3 tools/ci_build.py web debug

      - name: Release
        run: |
          source ~/emsdk/emsdk_env.sh
          python3 tools/ci_build.py web release

      - name: Test
        run: |
          source ~/emsdk/emsdk_env.sh
          node --test "port/web/tests/*.test.js"
          # (the dedicated server's admin page, port/assets/server_ui, against tools/server_sim.py)
          node --test tools/server_ui_tests/
          python3 -m pytest -q tools/test_web_build.py

      - name: Test in Chromium and Firefox
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/playwright" playwright@1.58
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium firefox
          NODE_PATH="$RUNNER_TEMP/playwright/node_modules" node port/web/tests/smoke.mjs dist/halo-web-release
          NODE_PATH="$RUNNER_TEMP/playwright/node_modules" node port/web/tests/rooms.mjs dist/halo-web-release
          # (the native builds' WebRTC, port/linux/src/p2p_webrtc.c, with both)
          NODE_PATH="$RUNNER_TEMP/playwright/node_modules" node port/web/tests/webrtc_native.mjs chromium firefox

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: halo-web-debug
          path: dist/halo-web-debug
          include-hidden-files: true
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: halo-web-release
          path: dist/halo-web-release
          include-hidden-files: true
          retention-days: 3

  release:
    # A fork's own releases (FractumSeraph/OpenCE): every push to its main
    # that builds on every platform is published as v<VERSION>-fs.<run>,
    # marked latest, with the files the self-updaters ask for
    # (chupathingyce-<platform>-<config>.zip; port/linux/src/updater.c,
    # Updater.java), signed with the fork's update key, and the dedicated
    # servers; with OpenCE's SHA256SUMS of the release's files and, when the
    # RELEASE_SIGNING_KEY secret is set, its Ed25519 signature
    # (SHA256SUMS.sig, tools/release_sign.sh); the newest five are kept.
    # ChupathingyCE's own releases come from its release workflows instead.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository != 'ChupathingyCE/chupathingyce'
    needs: [linux, linux64, server, android, android64, android32, windows, windows64, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # (cone mode: the folders' own files come too, tools/*.py among them,
      # which tools/ci_build.py imports)
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            VERSION
            tools/update_sign.py
            port/linux/src/update_key.h
            tools/ci_build.py
            tools/version.py
            tools/release_sign.sh
            deploy/release-key.pub
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          # the fork's release key's private half (Ed25519 PEM), which signs
          # the update files; its public half is in update_key.h and
          # UpdateManifest.java
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          # OpenCE's release key's seed (64 hex digits), which signs the
          # release's SHA256SUMS; checked against deploy/release-key.pub, or
          # the RELEASE_PUBLIC_KEY variable's key (a fork's own)
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_PUBLIC_KEY: ${{ vars.RELEASE_PUBLIC_KEY }}
        run: |
          version="$(cat VERSION)-fs.$(printf '%05d' "$GITHUB_RUN_NUMBER")"
          mkdir release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            case "$name" in
              chupathingyce-build-info|chupathingyce-server-container*) continue ;;
              chupathingyce-android-debug-testkey) zipname=chupathingyce-android-debug ;;
              chupathingyce-android-release-unsigned) zipname=chupathingyce-android-release ;;
              chupathingyce-android64-debug-testkey) zipname=chupathingyce-android64-debug ;;
              chupathingyce-android64-release-unsigned) zipname=chupathingyce-android64-release ;;
              chupathingyce-android32-debug-testkey) zipname=chupathingyce-android32-debug ;;
              chupathingyce-android32-release-unsigned) zipname=chupathingyce-android32-release ;;
              *) zipname=$name ;;
            esac
            # (macOS's builds come as a tar, keeping the application's links)
            if ls "$dir"/*.tar >/dev/null 2>&1; then
              mkdir -p "unpacked/$name" && tar -C "unpacked/$name" -xf "$dir"/*.tar && dir="unpacked/$name/$name/"
            fi
            (cd "$dir" && zip -qry "$GITHUB_WORKSPACE/release/$zipname.zip" .)
          done
          # (the release apps bare as well, signed with the fork's key, at
          # names that stay the same, for a phone to install from a link:
          # releases/latest/download/fractum-halo-android.apk is always the
          # newest; halo.fractumseraph.net/assets/android/ links them;
          # fractum-halo-android32.apk is for a 32-bit-only Android, a watch's)
          for build in android android64 android32; do
            apk=$(find "artifacts/chupathingyce-$build-release-unsigned" -name '*.apk' | head -n 1)
            if [ -n "$apk" ]; then cp "$apk" "release/fractum-halo-$build.apk"; fi
          done
          # (the update files signed for the self-updaters: each zip's .sig, and
          # the release's list of them, updates.json and its .sig; checked
          # against update_key.h before they go out. tools/update_sign.py)
          files=(release/*.zip release/*.apk)
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            key="$RUNNER_TEMP/update-key.pem"
            (umask 077 && printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key")
            python3 tools/update_sign.py sign "$key" "$version" release/*.zip >/dev/null
            python3 tools/update_sign.py manifest "$key" "$version" --tag "v$version" --debug-tag "v$version" \
              --commit "$GITHUB_SHA" release/*.zip >/dev/null
            rm -f "$key"
            python3 tools/update_sign.py verify "$version" release/*.zip
            files+=(release/*.sig release/updates.json)
          else
            echo "::warning::no UPDATE_SIGNING_KEY secret: this release is not signed, and the self-updaters will not install it"
          fi
          # (OpenCE's SHA256SUMS of the release's files, and its signature by
          # the release key when the secret is set: tools/release_sign.sh,
          # checked before anything is published. Beside the update files'
          # signatures above, which the self-updaters check: not instead)
          python3 tools/ci_build.py sums release
          files+=(release/SHA256SUMS)
          if [ -n "$RELEASE_SIGNING_KEY" ]; then
            sh tools/release_sign.sh sign release/SHA256SUMS
            sh tools/release_sign.sh verify release/SHA256SUMS
            files+=(release/SHA256SUMS.sig)
          else
            echo "::warning::no RELEASE_SIGNING_KEY secret: the release's SHA256SUMS is not signed"
          fi
          ls -l release
          {
            echo "Built from $GITHUB_SHA on $GITHUB_REF_NAME (version $version)."
            echo
            echo "The release builds are for playing; the debug builds stop at the first failed assertion."
          } > notes.txt
          gh release create "v$version" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$version" --notes-file notes.txt --latest
          # (the newest five of these kept)
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | contains("-fs."))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r tag; do gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag; done
