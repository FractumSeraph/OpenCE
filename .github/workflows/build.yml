          name: chupathingyce-android-release-unsigned
          path: dist/chupathingyce-android-release
          retention-days: 3

      # (kept by ChupathingyCE's release, not a download)
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-android-release
          path: dist/chupathingyce-android-release-symbols
          if-no-files-found: ignore
          retention-days: 3

      - uses: actions/cache/save@v4
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        with:
          path: .ccache
          key: ccache-android-${{ github.sha }}

