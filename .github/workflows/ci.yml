name: Source CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/signaling/package-lock.json
      - name: Enforce source-only repository
        run: node .github/scripts/verify-source-only.mjs
      - name: Install signaling dependencies
        run: npm ci
        working-directory: services/signaling
      - name: Check signaling Worker
        run: npm run check
        working-directory: services/signaling
      - name: Test browser JavaScript
        run: node --test port/web/tests/*.js
      - name: Validate hosting Worker syntax
        run: node --check services/web/src/index.js
      - name: Validate operations CLI syntax
        run: node --check tools/halo_telemetry.mjs
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate AWS infrastructure
        run: |
          python -m pip install cfn-lint==1.57.1
          cfn-lint infra/aws-native-gateway/template.yml
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - name: Check native-link gateway
        working-directory: services/native-gateway
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
