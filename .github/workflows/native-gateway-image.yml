name: Publish native gateway image

on:
  push:
    branches: [main]
    paths:
      - "services/native-gateway/**"
      - ".github/workflows/native-gateway-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: halo-native-gateway-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: services/native-gateway
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/halo-native-gateway:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/halo-native-gateway:latest
